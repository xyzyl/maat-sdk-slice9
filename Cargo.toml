[workspace]
members = [
    "crates/maat-sdk-core",
    "crates/maat-agent",
    "crates/maat-resource",
]
resolver = "2"

[workspace.dependencies]
# Protocol library — path dependency to the maat repo sibling.
maat = { path = "../maat" }

# Async runtime + HTTP.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Error handling + logging.
thiserror = "1"
anyhow = "1"
tracing = "0.1"

# Identity + concurrency.
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

# Test infrastructure.
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
